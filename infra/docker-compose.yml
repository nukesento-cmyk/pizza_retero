name: retero
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: retero
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retero"]
      interval: 2s
      timeout: 3s
      retries: 30
  # S3-compatible object storage (local dev). Production uses S3 / Supabase Storage.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256 -volume.max=8
    ports:
      - "9100:8333"
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
volumes:
  pgdata:
  s3data:
